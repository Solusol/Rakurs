name: Install character palette swatches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/character-palette.yml'
      - 'scripts/patch_character_palette.py'
      - 'scripts/character_palette.fragment.js'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: install-character-palette
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source-locked palette patch
        run: python scripts/patch_character_palette.py
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use active palette swatches for character block backgrounds'
          git push origin HEAD:main
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
